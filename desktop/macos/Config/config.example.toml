asr_provider = "volcengine"
agentstick_api_key = ""
agentstick_cloud_url = "wss://api.xiaozhi.me/agentstick/asr/"
volcengine_api_key = "your_volcengine_access_key"
volcengine_app_key = ""  # set for old-style auth (X-Api-App-Key + X-Api-Access-Key)
llm_base_url = "https://api.openai.com/v1"
llm_api_key = "your_openai_compatible_llm_api_key"
llm_model = "gpt-5.5"
interaction_mode = "hold_to_talk"
resource_id = "volc.seedasr.sauc.duration"
asr_hotwords = "小智,AgentStick"
paired_device_ids = ""
device_theme_colors = ""
device_overlay_positions = ""
auto_enter = true
agent_capture_enabled = true
agent_sound_alerts_enabled = true
agent_bypass_approvals = false
agent_memory_enabled = true
device_sound_volume = 70
debug_audio_cache = false
# debug_audio_dir = "~/Library/Application Support/AgentStick/DebugAudio"

[output]
target = "focused_app"
transform = "original"
translation_target = "en"

# On boards with a secondary app button, side click while idle cycles:
# Text Paste -> Agent Run. On Lichuang, use the macOS menu to switch.
# Set [output].target to "agent_cli" to start in Agent Run mode.
[agent]
default = "claude" # or "codex" / "imessage" / "workbuddy"
cwd = "~/work/my-project"
timeout_seconds = 600

[agents.claude]
type = "claude_print"

[agents.codex]
type = "codex_exec"

# Send a task to a remote agent through Messages.app. `recipient` can be the
# agent's iMessage email address or phone number. The remote agent must include
# the [AgentStick:XXXXXXXX] tag from the request in its reply.
[agents.imessage]
type = "imessage"
recipient = "remote-agent@example.com"

# Send the task to the WorkBuddy client signed in on this Mac. The task runs locally
# and the device is alerted when it finishes.
# client_secret is never written here; paste it once in Settings and it goes to the Keychain.
# The OAuth callback URL registered on the open platform must be exactly:
#   http://localhost:8799/oauth/callback
[agents.workbuddy]
type = "workbuddy_local"
# Optional override; omitted or empty uses AgentStick’s built-in developer application.
# client_id = "your_workbuddy_client_id"
# Wait this long after the last WorkBuddy message before treating the reply as final.
settle_seconds = 15
# Only needed when the platform registered a different loopback callback.
# Must match the open platform entry byte for byte; localhost and 127.0.0.1 are not equal.
# redirect_uri = "http://localhost:8799/oauth/callback"

# Optional per-device output overrides:
# [device.C3D8.output]
# transform = "translate"
# translation_target = "en"
#
# [device."09AF".output]
# transform = "translate"
# translation_target = "zh-Hans"

# UI language: "system" (follow macOS), "en" (English), "zh-Hans" (简体中文)
# app_language = "system"
